<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
#map{height:420px;border-radius:12px;border:1px solid var(--line);margin:10px 0 6px;z-index:0;background:var(--bg)}
.map-cities{display:flex;gap:6px;flex-wrap:wrap}
.map-cities button{font:inherit;font-size:.88rem;border:1px solid var(--line);background:var(--bg);color:var(--text);border-radius:999px;padding:6px 14px;cursor:pointer}
.map-cities button.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.legend{font-size:.85rem;color:var(--muted);display:flex;gap:6px 14px;flex-wrap:wrap;align-items:center}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:5px;vertical-align:-1px;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.dot.sight{background:#1f5fa8}.dot.food{background:#c0661e}.dot.travel{background:#5b6b3a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}}
:root[data-theme="dark"] .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.9)}
.leaflet-popup-content{font:14px/1.45 Inter,system-ui,sans-serif;margin:10px 12px}
.leaflet-popup-content b{display:block;font-size:15px;margin-bottom:2px}
.leaflet-popup-content a{display:inline-block;margin-top:6px}
.table-wrap{overflow-x:auto;margin:.3em 0 1em}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:600;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em}
td:nth-child(n+2),th:nth-child(n+2){text-align:right;white-space:nowrap}
@media (max-width:600px){#map{height:340px}}
</style>
<section id="map-section">
  <h2>🗺️ Map</h2>
  <p>The classic route runs west from <strong>Tashkent</strong> to <strong>Samarkand</strong>, <strong>Bukhara</strong> and <strong>Khiva</strong>. Tap a city to zoom in, and tap a pin for details and directions.</p>
  <div class="map-cities" role="group" aria-label="Zoom to city">
    <button type="button" data-city="all" class="on">All</button>
    <button type="button" data-city="tashkent">Tashkent</button>
    <button type="button" data-city="samarkand">Samarkand</button>
    <button type="button" data-city="bukhara">Bukhara</button>
    <button type="button" data-city="khiva">Khiva</button>
  </div>
  <div id="map" role="region" aria-label="Map of main places in Uzbekistan"></div>
  <p class="legend"><span class="dot sight"></span>Sight <span class="dot food"></span>Food &amp; bazaar <span class="dot travel"></span>Airport &amp; station</p>
</section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function(){
  const el = document.getElementById('map');
  if (!window.L) { el.innerHTML = '<p class="note" style="padding:16px">The map needs an internet connection to load.</p>'; return; }

  // [name, lat, lng, city, kind, note]
  const places = [
    ['Tashkent International Airport', 41.2579, 69.2812, 'tashkent', 'travel', 'Use the ATM, buy a SIM, order Yandex Go.'],
    ['Tashkent railway station', 41.2925, 69.2870, 'tashkent', 'travel', 'Afrosiyob trains. Arrive 30 min early for security.'],
    ['Chorsu Bazaar', 41.3262, 69.2367, 'tashkent', 'food', 'Big domed market in the centre.'],
    ['Hazrati Imam Complex', 41.3380, 69.2408, 'tashkent', 'sight', 'Home to the Uthman Quran, one of the oldest in the world.'],
    ['Central Asian Plov Centre (Besh Qozon)', 41.3413, 69.2856, 'tashkent', 'food', 'Plov from giant kazans. Go at lunch, 10:00–13:00.'],
    ['Amir Timur Square', 41.3111, 69.2797, 'tashkent', 'sight', 'Central square; near several ornate metro stations.'],
    ['Registan Square', 39.6547, 66.9758, 'samarkand', 'sight', 'Three madrasahs — the postcard view of Uzbekistan.'],
    ['Gur-e Amir', 39.6485, 66.9690, 'samarkand', 'sight', 'Mausoleum of Timur (Tamerlane).'],
    ['Shah-i-Zinda', 39.6630, 66.9880, 'samarkand', 'sight', 'Blue-tiled necropolis. Cash only.'],
    ['Siyob Bazaar', 39.6616, 66.9823, 'samarkand', 'food', 'Main market, next to Bibi-Khanym Mosque.'],
    ['Lyab-i Hauz', 39.7737, 64.4214, 'bukhara', 'sight', 'Ensemble around a historic pool; cafés in the evening.'],
    ['Kalon Minaret & Mosque', 39.7758, 64.4146, 'bukhara', 'sight', 'The symbol of Bukhara.'],
    ['Mir-i-Arab Madrasah', 39.7760, 64.4155, 'bukhara', 'sight', 'Opposite the Kalon Mosque.'],
    ['The Ark', 39.7778, 64.4108, 'bukhara', 'sight', 'Bukhara’s fortress.'],
    ['Itchan Kala', 41.3783, 60.3597, 'khiva', 'sight', 'The walled old town. Avoid winter and midsummer.'],
    ['Kalta Minor', 41.3786, 60.3574, 'khiva', 'sight', 'Short, unfinished, fully tiled minaret.'],
    ['Kunya Ark', 41.3785, 60.3565, 'khiva', 'sight', 'The old fortress.'],
    ['Juma Mosque', 41.3790, 60.3594, 'khiva', 'sight', 'Hall of more than 200 wooden columns.']
  ];
  const colors = { sight: '#1f5fa8', food: '#c0661e', travel: '#5b6b3a' };
  const cityCentres = { tashkent: [41.3111, 69.2797], samarkand: [39.6547, 66.9758], bukhara: [39.7747, 64.4175], khiva: [41.3783, 60.3585] };

  const map = L.map(el, { scrollWheelZoom: false, tap: true });
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
  }).addTo(map);

  // Classic route between the four cities.
  L.polyline([cityCentres.tashkent, cityCentres.samarkand, cityCentres.bukhara, cityCentres.khiva],
    { color: '#b7812a', weight: 3, dashArray: '6 8', opacity: .9 }).addTo(map);

  const byCity = {};
  places.forEach(([name, lat, lng, city, kind, note]) => {
    const gmaps = 'https://www.google.com/maps/search/?api=1&query=' + lat + ',' + lng;
    L.circleMarker([lat, lng], { radius: 8, color: '#fff', weight: 2, fillColor: colors[kind], fillOpacity: 1 })
      .bindPopup('<b>' + name + '</b>' + note + '<br><a href="' + gmaps + '" target="_blank" rel="noopener">Open in Google Maps →</a>')
      .addTo(map);
    (byCity[city] = byCity[city] || []).push([lat, lng]);
  });

  const all = L.latLngBounds(places.map(p => [p[1], p[2]]));
  const show = city => city === 'all'
    ? map.fitBounds(all, { padding: [24, 24] })
    : map.fitBounds(L.latLngBounds(byCity[city]), { padding: [40, 40], maxZoom: 16 });
  show('all');

  document.querySelectorAll('.map-cities button').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.map-cities button').forEach(x => x.classList.toggle('on', x === b));
    show(b.dataset.city);
  }));

  // Leaflet needs a size refresh after the map was hidden by a search or a resize.
  const refresh = () => { if (el.offsetParent) map.invalidateSize(); };
  addEventListener('uz-search', refresh);
  addEventListener('resize', refresh);
})();
</script>

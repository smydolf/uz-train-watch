async function submitLogin() {
  const L = ui.login, f = document.getElementById("login");
  L.user = f.user.value; L.pass = f.password.value;
  if (!L.user.trim() || !L.pass) { L.err = "Enter your username and password."; return renderLogin(); }
  L.err = ""; L.busy = true; renderLogin();
  let res = null;
  try {
    res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: L.user.trim(), password: L.pass }) });
  } catch {}
  L.busy = false;
  if (!res) { L.err = "No connection. Try again when you are online."; return renderLogin(); }
  if (!res.ok) { L.err = (await res.json().catch(() => null))?.error || "Sign-in failed. Try again."; return renderLogin(); }
  L.pass = "";
  history.replaceState(null, "", `${location.pathname}${location.search}#now`);
  readHash();
  await loadData(true);
}

async function logout() {
  try {
    const c = await caches.open(CACHE);
    await c.delete("/api/app");
    for (const f of M ? allFiles() : []) await c.delete(fileUrl(f));
  } catch {}
  location.href = "/logout";
}

function renderMessage(title, text) {
  $app.innerHTML = `<main class="scr"><section class="card now"><div class="now-lbl"><i></i>TRIP</div><div class="now-title">${esc(title)}</div>
<div class="now-note">${esc(text)}</div><div class="two"><button class="btn pri" data-act="retry">Try again</button></div></section></main>`;
}

// ---- Data ----
async function loadData(show) {
  let res = null;
  try { res = await fetch("/api/app", { headers: { Accept: "application/json" }, cache: "no-store" }); } catch {}
  if (res?.status === 401) { data = M = null; lastText = ""; return renderLogin(); }
  if (!res || !res.ok) {
    if (!data) renderMessage(res ? "Something went wrong" : "No connection", res ? `The server answered ${res.status}. Try again in a minute.` : "Open the app once with a connection. After that it works offline.");
    return;
  }
  const rev = visitsRev, text = await res.text();
  if (!data || text !== lastText) {
    const kept = data?.visits;
    lastText = text; data = JSON.parse(text);
    if (rev !== visitsRev && kept) data.visits = kept; // a BEEN THERE change landed after this request left: keep its answer
    M = build(data);
    applyTripKit(data.trip.kit);
    if (data.trip.start) { store.hero = { start: data.trip.start, end: data.trip.end, segments: M.segments }; persist(); }
    if (show || !busy()) render(); else dirty = true;
    precacheFiles();
  }
  sendVisitOps(); refreshStays(); checkHere();
}

// Re-render once a minute so Now and Next move on; never while the user is typing.
let lastMinute = "", dirty = false;
function tick() {
  if (!M) return;
  const c = clock(), k = c.date + c.hm;
  if (k !== lastMinute) { lastMinute = k; dirty = true; }
  if (dirty && !busy()) render();
}

function readHash() {
  const [tab, date] = decodeURIComponent(location.hash.slice(1)).split("/");
  ui.tab = TABS.includes(tab) ? tab : "now";
  ui.day = ui.tab === "day" && /^\d{4}-\d{2}-\d{2}$/.test(date || "") ? date : null;
}

// ---- Events ----
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = e.target.closest("a[href]");
  if (a && a !== el && el.contains(a)) return; // a link inside a tappable row: follow the link
  const id = el.dataset.id;
  switch (el.dataset.act) {
    case "skip": if (store.skipped[id]) delete store.skipped[id]; else { store.skipped[id] = true; delete store.done[id]; } save(); render(); break;
    case "order-reset": delete store.order[el.dataset.date]; save(); M = build(data); render(); break;
    case "done": if (store.done[id]) delete store.done[id]; else { store.done[id] = true; delete store.skipped[id]; } save(); render(); break;
    case "note": if (ui.notes.has(id)) ui.notes.delete(id); else ui.notes.add(id); render(); break;
    case "clamp": el.classList.toggle("clamp"); break;
    case "tday": ui.openDay = ui.openDay === el.dataset.date ? null : el.dataset.date; render(); break;
    case "slips": ui.slipsOpen = !ui.slipsOpen; render(); break;
    case "slip": toggleSlip(id); render(); break;
    case "kit-edit":
      if (ui.kitEdit) { store.kitItems = store.kitItems.filter((k) => k.label.trim()); save(); }
      ui.kitEdit = !ui.kitEdit; render(); break;
    case "kit-tick": store.kitItems = store.kitItems.map((k) => (k.id === id ? { ...k, done: !k.done } : k)); save(); render(); break;
    case "kit-del": store.kitItems = store.kitItems.filter((k) => k.id !== id); save(); render(); break;
    case "kit-add": addKit(); break;
    case "uzs": ui.uzs = +el.dataset.v; render(); break;
    case "nav": store.navMode = el.dataset.mode; save(); render(); break;
    case "lg-show": {
      const f = document.getElementById("login");
      ui.login.user = f.user.value; ui.login.pass = f.password.value; ui.login.show = !ui.login.show;
      renderLogin(); document.getElementById("lg-pass").focus(); break;
    }
    case "logout": logout(); break;
    case "retry": loadData(true); break;
    case "geo": {
      const m = shownMap(), el = document.getElementById("mapbox");
      if (!store.geoOn) { store.geoOn = true; geo.err = ""; save(); geo.recenter = true; geoStart(); }
      else if (m && el) centreMap(m, el);
      drawDot();
      break;
    }
    case "geo-off": store.geoOn = false; save(); geoStop(); geo.fix = null; geo.err = ""; drawDot(); break;
    case "v-yes": { const p = shownQ?.cands[+el.dataset.i]; if (p) answerYes(shownQ, { name: p.n, kind: p.k, lat: p.lat, lon: p.lon, osm: p.id }); break; }
    case "v-no": {
      const q = shownQ;
      if (!q) break;
      if (q.kind === "here" && here.force) endForce();
      else visitOp({ op: "skip", keys: q.kind === "here" ? q.cands.slice(0, 5).map((p) => `osm:${p.id}`) : [q.key] });
      break;
    }
    case "v-other": ui.vOther = true; render(); document.getElementById("v-name")?.focus(); break;
    case "v-save": saveOther(); break;
    case "v-quiet": if (shownQ) visitOp({ op: "quiet", lat: +shownQ.lat.toFixed(6), lon: +shownQ.lon.toFixed(6) }); break;
    case "v-here": checkHere(true); break;
    case "v-cancel": endForce(); break;
    case "v-del": { const x = visitsNow().list.find((x) => x.id === id); if (x && confirm(`Remove ${x.name} from BEEN THERE?`)) visitOp({ op: "del", id }); break; }
    case "v-add": addByName(); break;
    case "ask": store.askHere = el.dataset.on === "1"; persist(); if (store.askHere) { here.at = 0; checkHere(); } render(); break;
  }
});

function addKit() {
  const label = ui.kitDraft.trim();
  if (!label) return;
  store.kitItems = [...store.kitItems, { id: "k" + Date.now().toString(36), label, done: false }];
  ui.kitDraft = ""; save(); render();
  document.getElementById("kit-draft")?.focus();
}

document.addEventListener("input", (e) => {
  const el = e.target;
  switch (el.dataset.input) {
    case "uzs": {
      const digits = el.value.replace(/\D/g, "").slice(0, 12);
      ui.uzs = +digits || 0;
      el.value = digits ? fmt(ui.uzs) : "";
      document.getElementById("pln").textContent = plnText(ui.uzs, data.rates?.UZS || FALLBACK_RATE);
      break;
    }
    case "kit-rename": {
      const k = store.kitItems.find((k) => k.id === el.dataset.id);
      if (k) { k.label = el.value; save(); document.getElementById("kit-saved").textContent = savedNote(); }
      break;
    }
    case "kit-draft": ui.kitDraft = el.value; break;
    case "v-name": ui.vName = el.value; break;
    case "v-add": ui.vAdd = el.value; break;
    case "lg":
      if (ui.login.err) {
        ui.login.err = "";
        document.querySelector(".lg-err")?.remove();
        document.querySelectorAll(".bad").forEach((n) => n.classList.remove("bad"));
      }
      break;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter") return;
  if (e.target.id === "kit-draft") { e.preventDefault(); addKit(); }
  else if (e.target.id === "v-name") { e.preventDefault(); saveOther(); }
  else if (e.target.id === "v-add") { e.preventDefault(); addByName(); }
  else if (e.target.dataset?.input === "kit-rename") { e.preventDefault(); e.target.blur(); }
});
document.addEventListener("submit", (e) => { if (e.target.id === "login") { e.preventDefault(); submitLogin(); } });
document.addEventListener("focusout", () => setTimeout(tick, 0));

// Drag a stop by its grip. The row follows the finger, a teal line shows where it will land, and on release it
// takes that place. Near the top or bottom of the screen the page scrolls. Arrow keys on the grip move it one step.
document.addEventListener("pointerdown", (e) => {
  const grip = e.target.closest(".grip");
  if (!grip || !M || drag || (e.pointerType === "mouse" && e.button !== 0)) return;
  const row = grip.closest(".stop"), route = row.closest("#route");
  e.preventDefault();
  grip.setPointerCapture?.(e.pointerId);
  const rows = [...route.querySelectorAll(".stop[data-move]")], y = window.scrollY;
  drag = { id: row.dataset.move, date: route.dataset.date, row, grip, pointer: e.pointerId, y0: e.clientY + y, cy: e.clientY, from: rows.indexOf(row), to: rows.indexOf(row),
    others: rows.filter((r) => r !== row).map((r) => { const b = r.getBoundingClientRect(); return { r, mid: b.top + y + b.height / 2 }; }) };
  row.classList.add("lift");
  document.documentElement.classList.add("dragging");
  drag.timer = setInterval(() => {
    if (!drag) return;
    const edge = drag.cy < 90 ? -1 : drag.cy > innerHeight - 110 ? 1 : 0;
    if (edge) { window.scrollBy(0, edge * 10); dragMove(); }
  }, 16);
});
function dragMove() {
  const py = drag.cy + window.scrollY;
  drag.row.style.transform = `translateY(${py - drag.y0}px)`;
  const to = drag.others.filter((o) => o.mid < py).length;
  if (to === drag.to && drag.shown) return;
  drag.to = to; drag.shown = true;
  // No line while the stop is over its own place.
  drag.others.forEach((o, k) => {
    o.r.classList.toggle("drop-before", to !== drag.from && k === to);
    o.r.classList.toggle("drop-after", to !== drag.from && to === drag.others.length && k === to - 1);
  });
}
document.addEventListener("pointermove", (e) => {
  if (!drag || e.pointerId !== drag.pointer) return;
  e.preventDefault();
  drag.cy = e.clientY; dragMove();
}, { passive: false });
function dragEnd(e) {
  if (!drag || e.pointerId !== drag.pointer) return;
  const d = drag;
  drag = null;
  clearInterval(d.timer);
  document.documentElement.classList.remove("dragging");
  if (e.type === "pointerup" && d.shown) moveStop(d.date, d.id, d.to);
  render();
}
document.addEventListener("pointerup", dragEnd);
document.addEventListener("pointercancel", dragEnd);
document.addEventListener("keydown", (e) => {
  const grip = e.target.closest?.(".grip");
  if (!grip || !M || (e.key !== "ArrowUp" && e.key !== "ArrowDown")) return;
  e.preventDefault();
  const date = grip.closest("#route").dataset.date, id = grip.dataset.id;
  const at = M.days[date].items.filter(movable).findIndex((x) => x.id === id);
  if (!moveStop(date, id, at + (e.key === "ArrowUp" ? -1 : 1))) return;
  render();
  [...document.querySelectorAll(".grip")].find((g) => g.dataset.id === id)?.focus();
});

// Swipe left or right on the route to change the day.
let touch = null;
document.addEventListener("touchstart", (e) => {
  touch = ui.tab === "day" && e.target.closest("#route") && !e.target.closest(".grip") ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : null;
}, { passive: true });
document.addEventListener("touchend", (e) => {
  if (!touch || !M) return;
  const dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  touch = null;
  if (Math.abs(dx) < 60 || Math.abs(dy) > 40) return;
  const cur = M.days[ui.day] ? ui.day : clampDate(clock().date), next = M.dates[M.dates.indexOf(cur) + (dx < 0 ? 1 : -1)];
  if (next) location.hash = `#day/${next}`;
}, { passive: true });

window.addEventListener("hashchange", () => { readHash(); render(); window.scrollTo(0, 0); });
document.addEventListener("visibilitychange", () => {
  if (document.hidden) { geoStop(); return; }
  if (M) { tick(); loadData(false); geoResume(); }
});
matchMedia("(display-mode: standalone)").addEventListener?.("change", render);

if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
document.documentElement.classList.toggle("standalone", standalone());
readHash();
loadData(true);
setInterval(tick, 15000);
setInterval(() => loadData(false), 5 * 60000);
</script>
</body>
</html>

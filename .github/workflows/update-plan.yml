# Replace one day of the private day plan (KV key "trip", field plan[date]) without putting the plan in git.
# Run it by hand (Actions tab or API) with the day as JSON: {"date": "YYYY-MM-DD", "slots": [...]}.
# The logs are public, so the input is read from the event file and never printed. Before writing, the
# current trip is copied to the KV key "trip:backup:<run id>". dry_run checks the input without writing.
name: Update day plan

on:
  workflow_dispatch:
    inputs:
      day:
        description: 'The day as JSON: {"date": "YYYY-MM-DD", "slots": [...]}'
        required: true
      dry_run:
        description: Check only, do not write
        type: boolean
        default: false

concurrency:
  group: update-plan
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - name: Merge the day into the trip data
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          jq -r '.inputs.day' "$GITHUB_EVENT_PATH" > "$RUNNER_TEMP/day.json"
          npx wrangler kv key get trip --binding STATE --remote > "$RUNNER_TEMP/trip.json"
          cp "$RUNNER_TEMP/trip.json" "$RUNNER_TEMP/backup.json"
          node ../scripts/merge-plan.mjs "$RUNNER_TEMP/day.json" "$RUNNER_TEMP/trip.json"
          if [ "$DRY_RUN" = "true" ]; then echo "Dry run: nothing written"; exit 0; fi
          npx wrangler kv key put "trip:backup:$GITHUB_RUN_ID" --path "$RUNNER_TEMP/backup.json" --binding STATE --remote > /dev/null
          npx wrangler kv key put trip --path "$RUNNER_TEMP/trip.json" --binding STATE --remote > /dev/null
          echo "Updated. Backup key: trip:backup:$GITHUB_RUN_ID"
